<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobinar Search Engine</title>
    <style>
        /* Clean, brutalist dark mode UI */
        :root {
            --bg: #0a0a0a;
            --text: #ededed;
            --accent: #ffffff;
            --border: #333333;
            --link: #60a5fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }
        input {
            flex: 1;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 15px 20px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .result-item {
            margin-bottom: 30px;
            padding-left: 15px;
            border-left: 3px solid var(--border);
        }
        .result-title {
            color: var(--link);
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .result-url {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .result-content {
            font-size: 1rem;
            line-height: 1.5;
            color: #cccccc;
        }
        .meta-info {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loading {
            display: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cobinar Search</h1>
        
        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search the web..." required>
            <button type="submit">FETCH</button>
        </form>

        <div id="loading">Searching...</div>
        <div id="resultsContainer"></div>
    </div>

    <script>
        // === CONFIGURATION ===
        // Paste your exact Codespace Port 8080 URL here (no trailing slash)
        const SEARXNG_BASE_URL = "https://vigilant-space-broccoli-q7j6vgwjpgr5366w9-8080.app.github.dev";

        // === DOM ELEMENTS ===
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const loading = document.getElementById('loading');

        // === EVENT LISTENER ===
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop page from refreshing
            
            const query = input.value.trim();
            if (!query) return;

            // Clear UI and show loading text
            resultsContainer.innerHTML = '';
            loading.style.display = 'block';

            try {
                // Build the endpoint URL requesting JSON format
                const endpoint = `${SEARXNG_BASE_URL}/search?q=${encodeURIComponent(query)}&format=json`;
                
                // Fire the request to the SearXNG backend
                const response = await fetch(endpoint);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                // Parse the JSON payload
                const data = await response.json();
                
                loading.style.display = 'none';

                // Loop through the array and render HTML for each result
                if (data.results && data.results.length > 0) {
                    data.results.forEach(result => {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'result-item';
                        
                        resultDiv.innerHTML = `
                            <a href="${result.url}" class="result-title" target="_blank">${result.title}</a>
                            <div class="result-url">${result.url}</div>
                            <div class="result-content">${result.content || 'No description available.'}</div>
                            <div class="meta-info">Engine: ${result.engine}</div>
                        `;
                        
                        resultsContainer.appendChild(resultDiv);
                    });
                } else {
                    resultsContainer.innerHTML = '<p>No results found for this query.</p>';
                }

            } catch (error) {
                loading.style.display = 'none';
                console.error("Fetch error:", error);
                resultsContainer.innerHTML = `
                    <p style="color: #ef4444;">
                        <strong>Connection Error:</strong> ${error.message} <br><br>
                        <em>Check that your Codespace URL is correct and the port is set to Public.</em>
                    </p>
                `;
            }
        });
    </script>
</body>
</html>
