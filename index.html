<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobinar Search Engine</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ededed;
            --accent: #ffffff;
            --border: #333333;
            --link: #60a5fa;
            --ai-bg: #1a1a1a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }
        input {
            flex: 1;
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 15px 20px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .ai-summary {
            display: none;
            background: var(--ai-bg);
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            font-size: 1.15rem;
            line-height: 1.6;
            border-top: 4px solid var(--accent);
        }
        .result-item {
            margin-bottom: 30px;
            padding-left: 15px;
            border-left: 3px solid var(--border);
        }
        .result-title {
            color: var(--link);
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }
        .result-title:hover {
            text-decoration: underline;
        }
        .result-url {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .result-content {
            font-size: 1rem;
            line-height: 1.5;
            color: #cccccc;
        }
        .meta-info {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loading {
            display: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cobinar Search</h1>
        
        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search the web..." required>
            <button type="submit">FETCH</button>
        </form>

        <div id="loading">Searching and generating AI summary...</div>
        <div id="aiSummary" class="ai-summary"></div>
        <div id="resultsContainer"></div>
    </div>

    <script>
        // === CONFIGURATION ===
        // Change this to match your existing worker or the new one you deployed
        const WORKER_URL = "https://worker.search.cobinar.com";

        // === DOM ELEMENTS ===
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const aiSummaryDiv = document.getElementById('aiSummary');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            resultsContainer.innerHTML = '';
            aiSummaryDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Fetch data securely through your Cloudflare Worker proxy
                const endpoint = `${WORKER_URL}/?q=${encodeURIComponent(query)}`;
                const response = await fetch(endpoint);
                
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                loading.style.display = 'none';

                // 1. Render AI Summary
                if (data.ai_summary) {
                    aiSummaryDiv.innerHTML = `<strong>✨ AI Answer:</strong><br><br>${data.ai_summary}`;
                    aiSummaryDiv.style.display = 'block';
                }

                // 2. Render Search Results
                if (data.results && data.results.length > 0) {
                    data.results.forEach(result => {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'result-item';
                        resultDiv.innerHTML = `
                            <a href="${result.url}" class="result-title" target="_blank">${result.title}</a>
                            <div class="result-url">${result.url}</div>
                            <div class="result-content">${result.content || 'No description available.'}</div>
                            <div class="meta-info">Engine: ${result.engine}</div>
                        `;
                        resultsContainer.appendChild(resultDiv);
                    });
                } else {
                    resultsContainer.innerHTML = '<p>No results found.</p>';
                }

            } catch (error) {
                loading.style.display = 'none';
                resultsContainer.innerHTML = `
                    <p style="color: #ef4444;">
                        <strong>Connection Error:</strong> ${error.message} <br><br>
                        <em>Ensure your Cloudflare Worker URL is correct and your GitHub Codespace is awake.</em>
                    </p>
                `;
            }
        });
    </script>
</body>
</html>
