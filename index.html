<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobinar Search</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #202124; color: #bdc1c6; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 40px auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 12px 20px; border-radius: 24px; border: 1px solid #5f6368; background: #202124; color: white; font-size: 16px; outline: none; }
        input[type="text"]:focus { background: #303134; border-color: #8ab4f8; }
        button { padding: 12px 24px; border-radius: 24px; border: none; background: #8ab4f8; color: #202124; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        .tabs { display: flex; gap: 15px; border-bottom: 1px solid #3c4043; padding-bottom: 10px; margin-bottom: 20px; }
        .tab { color: #9aa0a6; cursor: pointer; padding-bottom: 10px; text-decoration: none; }
        .tab.active { color: #8ab4f8; border-bottom: 3px solid #8ab4f8; font-weight: bold; }

        .result { margin-bottom: 30px; }
        .site-info { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-size: 14px; color: #9aa0a6; }
        .favicon { width: 16px; height: 16px; border-radius: 50%; }
        .result-title { display: block; color: #8ab4f8; font-size: 20px; text-decoration: none; margin-bottom: 5px; }
        .result-title:hover { text-decoration: underline; }
        .result-content { font-size: 14px; line-height: 1.5; color: #bdc1c6; margin: 0; }
        
        .loading { display: none; color: #8ab4f8; }
    </style>
</head>
<body>

<div class="container">
    <!-- Search Form -->
    <form class="search-box" id="searchForm">
        <input type="text" id="searchInput" placeholder="Search the web..." required>
        <button type="submit">Search</button>
    </form>

    <!-- Categories -->
    <div class="tabs" id="tabs">
        <span class="tab active" data-category="general">All</span>
        <span class="tab" data-category="images">Images</span>
        <span class="tab" data-category="videos">Videos</span>
        <span class="tab" data-category="news">News</span>
    </div>

    <!-- Results Container -->
    <div id="loading" class="loading">Searching...</div>
    <div id="results"></div>
</div>

<script>
    // Point this to your new Cloudflare Worker
    const WORKER_URL = "https://worker.search.cobinar.com"; 
    
    let currentCategory = 'general';
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    const loading = document.getElementById('loading');
    const tabs = document.querySelectorAll('.tab');

    // Handle Tab Clicks
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            tabs.forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.getAttribute('data-category');
            if (searchInput.value) performSearch();
        });
    });

    // Handle Form Submit
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        performSearch();
    });

    async function performSearch() {
        const query = searchInput.value.trim();
        if (!query) return;

        resultsContainer.innerHTML = '';
        loading.style.display = 'block';

        try {
            const response = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}&category=${currentCategory}`);
            const data = await response.json();
            
            loading.style.display = 'none';
            renderResults(data.results || []);
        } catch (error) {
            loading.style.display = 'none';
            resultsContainer.innerHTML = '<p style="color: #f28b82;">Error connecting to search worker.</p>';
        }
    }

    function renderResults(results) {
        if (results.length === 0) {
            resultsContainer.innerHTML = '<p>No results found.</p>';
            return;
        }

        resultsContainer.innerHTML = results.map(result => {
            // Favicon Hack: Extract domain and use Google's favicon service
            const urlObj = new URL(result.url);
            const domain = urlObj.hostname;
            const faviconUrl = `https://www.google.com/s2/favicons?sz=64&domain_url=${domain}`;

            // Check if it's an image result
            if (currentCategory === 'images' && result.img_src) {
                return `
                    <div class="result" style="display:inline-block; margin: 10px; width: 200px; vertical-align: top;">
                        <a href="${result.url}" target="_blank">
                            <img src="${result.img_src}" style="max-width: 100%; border-radius: 8px;">
                        </a>
                        <a href="${result.url}" class="result-title" style="font-size: 14px;">${result.title}</a>
                    </div>
                `;
            }

            // Standard text result
            return `
                <div class="result">
                    <div class="site-info">
                        <img class="favicon" src="${faviconUrl}" alt="${domain}">
                        <span>${domain}</span>
                    </div>
                    <a href="${result.url}" class="result-title" target="_blank">${result.title}</a>
                    <p class="result-content">${result.content || ''}</p>
                </div>
            `;
        }).join('');
    }
</script>

</body>
</html>
